[build-system]
build-backend = "poetry.core.masonry.api"

# ==== pytest ====
requires = [ "poetry-core>=1", "setuptools<72" ]

[project]
name = "django-survey-axsapronov"
version = "1.0.0"
description = "A django survey app that can export results as CSV or PDF using your native language."
readme = "README.md"
license = { text = "AGPL-3.0" }
authors = [
  { email = "pierre.sassoulas@gmail.com", name = "Pierre SASSOULAS" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Natural Language :: English",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "django>=4,<6",
  "pytz>=2018.9",
  "pyyaml>=4.2b1",
]

optional-dependencies.dev = [
  "colorama",
  "coverage",
  "coveralls",
  "django-rosetta",
  "pre-commit",
  "pylint>=3.3.5",
  "pylint-django",
  "pytest",
  "pytest-django",
  "python-coveralls",
  "setuptools",
]

optional-dependencies.seo = [
  "django-meta",
]

urls."Bug Tracker" = "https://github.com/Pierre-Sassoulas/django-survey/issues"
urls."Source Code" = "https://github.com/Pierre-Sassoulas/django-survey"

[tool.poetry]
package-mode = true
packages = [ { include = "survey" } ]

[tool.poetry.group.dev.dependencies]
twine = "^6.1.0"
factory-boy = "^3.3.3"
pylint-django = { version = "^2.6.1", python = ">=3.13,<3.15" }

[tool.setuptools.packages.find]
include = [ "survey*" ]

[tool.ruff]
# Assume Python 3.8
target-version = "py312"

# Same as Black.
line-length = 119
indent-width = 4

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "migrations",
  "node_modules",
  "site-packages",
  "venv",
]

# Like Black, indent with spaces, rather than tabs.
format.indent-style = "space"
# Like Black, use double quotes for strings.
format.quote-style = "double"
# Like Black, automatically detect the appropriate line ending.
format.line-ending = "auto"
# Like Black, respect magic trailing commas.
format.skip-magic-trailing-comma = false
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
format.docstring-code-line-length = "dynamic"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
format.docstring-code-format = false
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
lint.select = [ "E4", "E7", "E9", "F", "I" ]
lint.ignore = [ "F811" ]
# Allow fix for all enabled rules (when `--fix`) is provided.
lint.fixable = [ "ALL" ]
lint.unfixable = [  ]
# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.isort.force-single-line = true

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_single_line = true
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [
  "project",
  "config",
]
skip = [ "venv/", "deploy/" ]
skip_glob = [ "**/migrations/*.py" ]

# ==== PyLint ====

[tool.pylint.MASTER]
load-plugins = [
  "pylint_django",
]
django-settings-module = "project.settings.base"

[tool.pylint.FORMAT]
max-line-length = 119

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "missing-docstring",
  "invalid-name",
]

[tool.pylint.DESIGN]
max-parents = 13

[tool.pylint.TYPECHECK]
generated-members = [
  "REQUEST",
  "acl_users",
  "aq_parent",
  "[a-zA-Z]+_set{1,2}",
  "save",
  "delete",
]

# ==== djLint ====

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=project.settings.test --reuse-db --import-mode=importlib"
python_files = [
  "tests.py",
  "test_*.py",
  "*_tests.py",
]

[tool.coverage.run]
include = [ "project/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== isort ====

[tool.django-stubs]
django_settings_module = "project.settings.test"

# ==== Coverage ====

[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/Riverside-Healthcare/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2
